name: caregap-team-local
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caregap
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: caregap_local
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT to an available local DB port}:5432"
    volumes:
      - caregap_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caregap -d caregap_local"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  caregap_local_data:

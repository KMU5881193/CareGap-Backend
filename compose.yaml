services:
  api:
    build: .
    ports:
      - "127.0.0.1:4320:4320"
    environment:
      NODE_ENV: development
      PORT: "4320"
      API_HOST: "0.0.0.0"
      CAREGAP_SYNTHETIC_HTTP: "1"
      STORAGE_MODE: memory
      OCR_PROVIDER: mock
      STT_PROVIDER: mock
      ANALYSIS_PROVIDER: mock
      FE_ORIGINS: ${FE_ORIGINS:-http://localhost:5173}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
